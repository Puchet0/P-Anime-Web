# ⚠️ DEPRECATED — use docker-compose.yaml (single image, full app) instead.
# This file uses pre-built images from Docker Hub and lacks the new env vars.
# Hardcoded secrets have been removed.

services:
  api-backend:
    image: puchet/puchflix-api-backend:latest
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DISABLE_AUTH=false
      - DISABLE_RATE_LIMIT=false
      - REQUEST_TIMEOUT_MS=10000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: puchet/puchflix-frontend:latest
    ports:
      - "8093:80"
    depends_on:
      - api-backend
    restart: unless-stopped

volumes:
  api-data:
  api-covers:
  api-cache:
