server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy covers to backend (^~ prefix matches before regex)
    location ^~ /covers/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://anime1v-api:3001;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        # Remove CSP so browser uses meta tag CSP (which includes 192.168.1.209)
        proxy_hide_header Content-Security-Policy;
    }

    # Proxy API calls to backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://anime1v-api:3001;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy downloads to backend
    location /downloads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://anime1v-api:3001;
        proxy_pass $api_backend;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}