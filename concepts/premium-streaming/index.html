<!doctype html>
<!--
  THESIS — Anime streaming con lenguaje editorial-cinematográfico (Netflix/Prime/HBO).
  Rails por categoría, no grids planos. Cada anime es un cartel con jerarquía editorial.
  OWN-WORLD — Obsidian + Amber: #0B0B0C / #16161A, ámbar #D9A441, halo #F4D58D.
  STORY — Hero dice qué ver. Rails tientan: continuar / recientes / temporada.
  FIRST VIEWPORT — Nav warm-glass + hero 21:9. Debajo rail "Continuar viendo".
  FORM — Persuade (home) + Operate (search/detail/watch/profile). Editorial-cinema.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amber — Anime Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<a class="skip" href="#main">Saltar al contenido</a>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="#/" aria-label="Inicio — Amber">
      <span class="nav__mark" aria-hidden="true"></span>
      <span class="nav__name">Amber</span>
      <span class="nav__tag">Anime</span>
    </a>

    <nav class="nav__primary" aria-label="Principal">
      <a href="#/" class="nav__link">Inicio</a>
      <a href="#/search" class="nav__link">Explorar</a>
      <a href="#/favorites" class="nav__link">Favoritos</a>
      <a href="#/history" class="nav__link">Historial</a>
    </nav>

    <form class="nav__search" role="search" onsubmit="return App.onSearchSubmit(event)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      </svg>
      <input id="navSearch" type="search" placeholder="Buscar anime, estudio, persona…" autocomplete="off">
    </form>

    <div class="nav__right">
      <button class="iconbtn" title="Notificaciones" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <a href="#/profile" class="avatar" aria-label="Perfil"><span>AP</span></a>
    </div>
  </div>
</header>

<main id="main" class="app" aria-live="polite"></main>

<footer class="foot">
  <div class="foot__inner">
    <div>
      <span class="foot__brand">Amber</span>
      <span class="foot__muted">— Prototipo de concepto. Datos de AniList</span>
    </div>
    <nav class="foot__links" aria-label="Secundario">
      <a href="#/">Inicio</a>
      <a href="#/search">Explorar</a>
      <a href="#/favorites">Favoritos</a>
      <a href="#/history">Historial</a>
      <a href="#/profile">Perfil</a>
    </nav>
    <p class="foot__note">El reproductor y la búsqueda multi-fuente conectan con el backend actual en el producto real</p>
  </div>
</footer>

<template id="tpl-rail">
  <section class="rail">
    <header class="rail__head">
      <h2 class="rail__title"></h2>
      <p class="rail__sub"></p>
      <div class="rail__nav" role="group" aria-label="Navegación de carrusel">
        <button class="iconbtn rail__prev" aria-label="Anterior">‹</button>
        <button class="iconbtn rail__next" aria-label="Siguiente">›</button>
      </div>
    </header>
    <div class="rail__viewport">
      <div class="rail__track"></div>
      <div class="rail__edge rail__edge--l" aria-hidden="true"></div>
      <div class="rail__edge rail__edge--r" aria-hidden="true"></div>
    </div>
  </section>
</template>

<template id="tpl-card">
  <a class="card" href="#" draggable="false">
    <div class="card__art">
      <span class="card__shim" aria-hidden="true"></span>
      <div class="card__overlay">
        <div class="card__rank"></div>
        <div class="card__meta">
          <span class="card__score" aria-label="Puntaje">★</span>
          <span class="card__chip card__chip--year"></span>
        </div>
        <div class="card__hue" aria-hidden="true"></div>
      </div>
      <button class="card__play" aria-label="Reproducir" tabindex="-1">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M7 5v14l12-7z" fill="currentColor"></path>
        </svg>
      </button>
    </div>
    <div class="card__cap">
      <p class="card__title"></p>
      <p class="card__sub"></p>
    </div>
  </a>
</template>

<script src="./assets/data.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
